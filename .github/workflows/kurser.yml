# Kurs-eksport til Drive-porteføljen (de planlagte Claude-kørsler "Trade agent").
#
# Henter daglige kurser for top-50 i Nasdaq-100 + QQQ efter lukketid og committer
# kurser/nasdaq50.json. Claude-kørslen om morgenen læser filen fra repoet, fordi den
# selv ikke kan hente kursdata. Offentligt repo, så de planlagte kørsler kan hente filen uden login.
name: Kurser og portefølje

on:
  schedule:
    - cron: '25 21 * * 1-5'    # efter lukketid i USA (sommer- og vintertid)
    - cron: '25 22 * * 1-5'
    - cron: '15 4 * * 2-6'     # reserve, hvis aftenkørslen fejlede eller blev forsinket
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kurser
  cancel-in-progress: false

jobs:
  kurser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Installér pakker
        run: pip install yfinance pandas requests

      - name: Hent kurser (med genforsøg)
        run: |
          for n in 1 2 3; do
            python kurser_export.py && exit 0
            echo "::warning::Forsøg $n fejlede - prøver igen om 5 minutter"
            sleep 300
          done
          exit 1

      - name: Før porteføljen frem
        id: pf
        run: |
          python drive_portefolje.py portefolje/trade-agent-portfolio.json kurser/nasdaq50.json portefolje/ny.json > portefolje/sidste_koersel.txt && rc=0 || rc=$?
          cat portefolje/sidste_koersel.txt
          if [ "$rc" -eq 0 ]; then
            mv portefolje/ny.json portefolje/trade-agent-portfolio.json
            cp portefolje/sidste_koersel.txt portefolje/rapport.txt
          elif [ "$rc" -ne 3 ]; then
            echo "::error::drive_portefolje.py fejlede (exit $rc)"; exit 1
          fi

      - name: Commit kurser og portefølje
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kurser/nasdaq50.json portefolje/trade-agent-portfolio.json portefolje/rapport.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Intet nyt"
            exit 0
          fi
          as_of=$(python -c "import json; print(json.load(open('kurser/nasdaq50.json'))['as_of'])")
          git commit -m "Kurser og portefølje (data til $as_of)"
          for n in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
